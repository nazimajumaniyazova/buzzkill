name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  TURBO_TELEMETRY_DISABLED: 1
  # On pull requests Turborepo tasks run with --affected, comparing against the base branch.
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  conventions:
    name: Conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js, pnpm and dependencies
        uses: ./.github/actions/setup

      - name: Lint commit messages
        run: >
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

      - name: Lint pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Reject AI attribution in the pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -iqE 'co-authored-by:[[:space:]]*claude|claude-session:|generated with \[?claude code'; then
            echo "::error::AI attribution lines are not allowed in the pull request description"
            exit 1
          fi

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js, pnpm and dependencies
        uses: ./.github/actions/setup

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-quality-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-quality-

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # coverage comment
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js, pnpm and dependencies
        uses: ./.github/actions/setup

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Report coverage on the pull request
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          file-coverage-mode: changes

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # No --with-deps: the runner image already has every library Chromium needs, and apt only
      # added fonts the stories do not use. apt also hung this job when the Ubuntu mirrors were
      # down (#140).
      - name: Install Playwright Chromium
        run: pnpm --filter @buzzkill/ui exec playwright install chromium

      # Every story renders in Chromium with its play function and the a11y check (#76).
      - name: Run the Storybook tests
        run: pnpm test:storybook

  # The backend (ADR-0007): a local Supabase stack in Docker, its database built from the
  # migrations, tested with pgTAP and compared with the database types the web app imports; then
  # runs played through the submit-run function, bundled from this commit (#218).
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js, pnpm and dependencies
        uses: ./.github/actions/setup

      # Before the stack starts, so the edge runtime finds the function's entrypoint.
      - name: Bundle the Edge Functions
        run: pnpm functions:build

      # The database, Auth, the REST API and the functions behind the gateway; the services no
      # check uses stay off.
      - name: Start the local backend from the migrations
        run: >-
          pnpm exec supabase start
          -x studio,imgproxy,mailpit,realtime,storage-api,logflare,vector,supavisor

      - name: Test the schema
        run: pnpm db:test

      # The same command as `pnpm db:types`, into a temporary file: the diff shows what changed,
      # or the whole file when none is committed yet.
      - name: Check that the generated database types are current
        run: |
          pnpm exec supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.gen.ts"
          if ! diff -u -N apps/web/src/backend/database.gen.ts "$RUNNER_TEMP/database.gen.ts"; then
            echo "::error::The database types are out of date: run pnpm db:types and commit them."
            exit 1
          fi

      # Anonymous sign-in, an honest run stored, a forged one logged, a stale build refused.
      - name: Play runs through the submit-run function
        run: |
          pnpm exec supabase status -o json > "$RUNNER_TEMP/supabase.json"
          export SUPABASE_URL="$(jq -r .API_URL "$RUNNER_TEMP/supabase.json")"
          export SUPABASE_PUBLISHABLE_KEY="$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/supabase.json")"
          export SUPABASE_SECRET_KEY="$(jq -r .SECRET_KEY "$RUNNER_TEMP/supabase.json")"
          pnpm functions:smoke

      - name: Show the function's log
        if: failure()
        run: docker logs "$(docker ps -q --filter name=supabase_edge_runtime)" 2>&1 | tail -n 100

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js, pnpm and dependencies
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The Chromium of the Storybook tests: @playwright/test and playwright are one release.
      - name: Install Playwright Chromium
        run: pnpm --filter @buzzkill/web exec playwright install chromium

      # The built app on an emulated Pixel 7, by touch, and on a desktop (#153).
      - name: Run the end-to-end tests
        run: pnpm test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js, pnpm and dependencies
        uses: ./.github/actions/setup

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-

      - name: Build
        run: pnpm build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
