name: Set up Node.js, pnpm and dependencies
description: >-
  Installs pnpm from the packageManager field of package.json, Node.js from .nvmrc with the pnpm
  store cached between runs, and the dependencies from the frozen lockfile.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
