packages:
  - apps/*
  - packages/*

# One version of each shared dependency for the whole repository (ADR-0001).
catalog:
  # UI framework (ADR-0002)
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  # Build and orchestration
  vite: ^8.3.5
  '@vitejs/plugin-react': ^6.1.2
  turbo: ^2.11.10
  # Language. TypeScript 7 (the native compiler) is released, but typescript-eslint
  # supports only < 6.1 at the time of writing, so the repository stays on 6.0.x.
  typescript: ~6.0.3
  # Linting. ESLint 9 is end-of-life (last release 9.39.5, deprecated on npm), so ESLint 10
  # is used even though eslint-plugin-react and eslint-plugin-jsx-a11y have not updated
  # their declared peer range yet; see peerDependencyRules below.
  eslint: ^10.13.0
  '@eslint/js': ^10.0.1
  # Testing
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  '@vitest/eslint-plugin': ^1.6.28
  eslint-plugin-testing-library: ^7.16.2
  '@testing-library/react': ^16.3.3
  '@testing-library/jest-dom': ^7.0.1
  vitest-axe: ^0.1.0
  jsdom: ^30.1.3
  '@fast-check/vitest': ^0.5.0

peerDependencyRules:
  allowedVersions:
    # Both plugins work with ESLint 10 (verified by running the full lint); their package.json
    # peer range just stops at 9. Remove once upstream publishes a release that lists 10.
    'eslint-plugin-react>eslint': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'

# pnpm blocks dependency install scripts by default; each allowed one is listed with its reason.
allowBuilds:
  # Native resolver used by eslint-plugin-import-x; the postinstall picks the platform binary.
  unrs-resolver: true
